<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>

<helmet data-dc-atomics>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./image-slot.js"></script>
</helmet>
<div style="min-height:100vh;background:#2a2f3a;display:flex;align-items:flex-start;justify-content:center;padding:28px 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
<x-import component-from-global-scope="IOSDevice" from="./ios-frame.jsx" hint-size="430px,900px">
  <div style="height:100%;display:flex;flex-direction:column;background:#fff;color:#1a2233;">

    <div style="padding:56px 18px 4px;flex-shrink:0;"></div>

    <div style="flex:1;overflow-y:auto;padding:14px 18px 20px;">
      <div style="font-size:19px;font-weight:800;letter-spacing:-0.3px;margin-bottom:16px;">Bem-vindo, o que vai desejar hoje?</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">
        <sc-for list="{{ services }}" as="sv" hint-placeholder-count="6">
          <div role="button" onClick="{{ sv.open }}" style="display:flex;align-items:center;justify-content:space-between;gap:8px;background:#fff;border:1px solid #e3e8f0;border-radius:14px;padding:12px;cursor:pointer;box-shadow:0 2px 8px rgba(26,34,51,.06);min-height:64px;box-sizing:border-box;">
            <div style="font-size:12.5px;font-weight:700;line-height:1.3;flex:1;min-width:0;">{{ sv.name }}</div>
            <image-slot id="{{ sv.imgId }}" shape="rounded" radius="10" placeholder="Foto" style="width:52px;height:52px;flex-shrink:0;"></image-slot>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- Bottom total bar -->
    <div style="flex-shrink:0;border-top:1px solid #e3e8f0;background:#fff;padding:12px 18px 8px;">
      <div style="font-size:12.5px;font-weight:800;margin-bottom:8px;">Total do Pedido</div>
      <div style="display:flex;align-items:center;gap:12px;margin-bottom:12px;">
        <div style="display:flex;align-items:center;gap:8px;flex:1;">
          <div style="position:relative;">
            <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#1a2233" stroke-width="1.8"><circle cx="9" cy="21" r="1.6"/><circle cx="19" cy="21" r="1.6"/><path d="M2 3h3l2.7 12.4a2 2 0 002 1.6h9.7a2 2 0 002-1.6L23 7H6"/></svg>
            <div style="position:absolute;top:-5px;right:-7px;background:#c0392b;color:#fff;font-size:9px;font-weight:800;min-width:15px;height:15px;border-radius:8px;display:flex;align-items:center;justify-content:center;padding:0 3px;">{{ cartCount }}</div>
          </div>
          <div style="font-size:16px;font-weight:800;color:#c0392b;">{{ totalLabel }}</div>
        </div>
        <button onClick="{{ viewOrders }}" disabled="{{ cartEmpty }}" style="padding:12px 24px;border-radius:12px;border:none;background:{{ orderBtnBg }};color:#fff;font-size:13px;font-weight:700;cursor:{{ orderBtnCursor }};">Ver pedidos</button>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding-bottom:22px;">
        <div style="display:flex;gap:8px;">
          <button onClick="{{ restart }}" style="padding:8px 16px;border-radius:18px;border:1px solid #d3dae6;background:#fff;font-size:11.5px;font-weight:700;color:#46526a;cursor:pointer;">Recomeçar</button>
          <button onClick="{{ toggleLang }}" style="padding:8px 16px;border-radius:18px;border:1px solid #d3dae6;background:#fff;font-size:11.5px;font-weight:700;color:#46526a;cursor:pointer;">Idioma {{ langFlag }}</button>
        </div>
      </div>
    </div>

    <sc-if value="{{ toast }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;bottom:150px;left:20px;right:20px;background:#1a2233;color:#fff;padding:12px 16px;border-radius:12px;font-size:12.5px;font-weight:600;box-shadow:0 12px 30px rgba(0,0,0,.3);z-index:100;text-align:center;">{{ toastMsg }}</div>
    </sc-if>

  </div>
</x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:480,&quot;height&quot;:950}}">

const SERVICES = [
  {id:'cb', name:'Coffee Break', imgId:'mh-cb', href:'./Mobile - Coffee Break.dc.html'},
  {id:'ee', name:'Eventos Especiais', imgId:'mh-ee', href:'./Mobile - Evento Especial.dc.html'},
  {id:'sp', name:'Surpreenda', imgId:'mh-sp', href:'./Mobile - Surpreenda.dc.html'},
  {id:'sa', name:'Solicitar Água', imgId:'mh-sa', href:null},
  {id:'as', name:'Abastecimento Simples', imgId:'mh-as', href:null},
  {id:'sd', name:'Serviços Diversos', imgId:'mh-sd', href:null},
];

class Component extends DCLogic {
  state = { toast: null, lang: 'pt' };

  toastMsg(msg) {
    this.setState({ toast: true, toastMsg: msg });
    clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: null }), 2200);
  }

  renderVals() {
    const s = this.state;
    return {
      services: SERVICES.map(sv => ({
        ...sv,
        open: () => sv.href ? (window.location.href = sv.href) : this.toastMsg('Disponível apenas na versão desktop (demo).'),
      })),
      cartCount: 0,
      cartEmpty: true,
      totalLabel: 'R$ 0,00',
      orderBtnBg: '#b9c2e2',
      orderBtnCursor: 'not-allowed',
      viewOrders: () => {},
      restart: () => this.toastMsg('Pedido reiniciado.'),
      toggleLang: () => { this.setState({ lang: s.lang === 'pt' ? 'en' : 'pt' }); this.toastMsg(s.lang === 'pt' ? 'Language: English (demo)' : 'Idioma: Português'); },
      langFlag: s.lang === 'pt' ? '🇧🇷' : '🇺🇸',
      toast: s.toast, toastMsg: s.toastMsg,
    };
  }
}

</script>
</body>
</html>
